name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:pass@localhost:5432/nal?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d . | head -100
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install codegen tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.30.0
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.30.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/vektra/mockery/v3@v3.7.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint proto
        run: buf lint
      - name: Regenerate and check for drift
        run: |
          buf generate
          (cd db && sqlc generate)
          mockery
          git diff --exit-code
      - name: Build with generated code
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: cd frontend && bun install
      - name: Lint
        run: cd frontend && bun run lint
      - name: Build
        run: cd frontend && bun run build
