syntax = "proto3";

package solari.ledger.v1;

option go_package = "github.com/babit/nal/gen/solari/ledger/v1;ledgerv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "solari/ledger/v1/common.proto";

service DelegationService {
  rpc IssueRootGrant(IssueRootGrantRequest) returns (IssueRootGrantResponse) {
    option (google.api.http) = {
      post: "/v1/grants:root"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Issue a root grant for a human principal"
    };
  }
  rpc Delegate(DelegateRequest) returns (DelegateResponse) {
    option (google.api.http) = {
      post: "/v1/grants"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delegate scoped authority to an agent or sub-agent"
    };
  }
  rpc VerifyChain(VerifyChainRequest) returns (VerifyChainResponse) {
    option (google.api.http) = {get: "/v1/grants/{grant_id}:verify"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Verify a delegation chain back to its root"
    };
  }
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (google.api.http) = {
      post: "/v1/grants/{grant_id}/revoke"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Revoke a grant and its descendants"
    };
  }
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {
    option (google.api.http) = {get: "/v1/grants"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List recent grants for the authenticated user"
    };
  }
}

message IssueRootGrantRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    example: "{\"principal_id\":\"usr_alice\",\"scope\":{\"max_depth\":3}}"
  };
  string principal_id = 1;
  Scope scope = 2;
}

message IssueRootGrantResponse {
  Grant grant = 1;
}

message DelegateRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    example: "{\"parent_grant_id\":\"BAL-417849\",\"subject_id\":\"agt_shopper\",\"capabilities\":[\"browser.click\",\"browser.type\"],\"scope\":{\"resource_globs\":[\"https://shop.example.com/*\"],\"max_value_cents\":50000,\"max_depth\":2}}"
  };
  string parent_grant_id = 1;
  string subject_id = 2;
  repeated string capabilities = 3;
  Scope scope = 4;
}

message DelegateResponse {
  Grant grant = 1;
}

message VerifyChainRequest {
  string grant_id = 1;
}

message VerifyChainResponse {
  bool valid = 1;
  repeated Grant chain = 2;
  string reason = 3;
}

message RevokeRequest {
  string grant_id = 1;
  string reason = 2;
}

message RevokeResponse {
  bool revoked = 1;
}

message ListGrantsRequest {
  int32 limit = 1;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
}
