syntax = "proto3";

package solari.ledger.v1;

option go_package = "github.com/babit/nal/gen/solari/ledger/v1;ledgerv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "solari/ledger/v1/common.proto";

service LedgerService {
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {
    option (google.api.http) = {get: "/v1/events/{event_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Read a sealed action event"
    };
  }
  rpc GetInclusionProof(GetInclusionProofRequest) returns (GetInclusionProofResponse) {
    option (google.api.http) = {get: "/v1/events/{event_id}:proof"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Build an offline-verifiable inclusion proof"
    };
  }
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {get: "/v1/events"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List recent action events for the authenticated user"
    };
  }
}

message GetEventRequest {
  string event_id = 1;
}

message GetEventResponse {
  ActionEvent event = 1;
}

message GetInclusionProofRequest {
  string event_id = 1;
}

message GetInclusionProofResponse {
  Proof proof = 1;
}

message ListEventsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string project_id = 3;
}

message ListEventsResponse {
  repeated ActionEvent events = 1;
  string next_page_token = 2;
}
