syntax = "proto3";

package solari.ledger.v1;

option go_package = "github.com/babit/nal/gen/solari/ledger/v1;ledgerv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "solari/ledger/v1/common.proto";

service NotaryService {
  rpc Notarize(NotarizeRequest) returns (NotarizeResponse);
  rpc GetAnchor(GetAnchorRequest) returns (GetAnchorResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/anchor"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Fetch the external anchor for a session"
      tags: "notary"
    };
  }
  rpc GetPublicKey(GetPublicKeyRequest) returns (GetPublicKeyResponse) {
    option (google.api.http) = {get: "/v1/notary/public-key"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Fetch the notary public key for offline verification"
      tags: "notary"
    };
  }
}

message NotarizeRequest {
  ActionEvent event = 1;
}

message NotarizeResponse {
  ActionEvent event = 1;
}

message GetAnchorRequest {
  string session_id = 1;
}

message GetAnchorResponse {
  Anchor anchor = 1;
}

message GetPublicKeyRequest {}

message GetPublicKeyResponse {
  string key_id = 1;
  bytes public_key = 2;
}
